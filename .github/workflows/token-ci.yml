name: Design Token CI

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'source/tokens/**'
      - 'source/component-contracts/**'
      - 'build/style-dictionary.config.mjs'
      - 'scripts/**'
      - 'registries/**'
      - 'release/**'
      - 'figma/**'
      - 'package.json'
  pull_request:
    paths:
      - 'source/tokens/**'
      - 'source/component-contracts/**'
      - 'build/style-dictionary.config.mjs'
      - 'scripts/**'
      - 'registries/**'
      - 'release/**'

jobs:
  # ── Job 1: Package Validation ─────────────────────────────────────────────
  validate:
    name: DTCG Package Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run validate_package.py
        run: python3 scripts/validate_package.py .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validate-dtcg.mjs
        run: node scripts/validate-dtcg.mjs --dir source/tokens

  # ── Job 2: Style Dictionary Build ─────────────────────────────────────────
  build:
    name: Style Dictionary Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # npm install instead of npm ci — no package-lock.json in repo yet
        run: npm install

      - name: Rebuild token index
        run: python3 scripts/build_token_index.py source/tokens

      - name: Build token artifacts
        run: npm run build

      - name: Verify dist/ artifacts exist
        run: |
          for f in dist/css/arco.css dist/css/arco-dark.css dist/scss/_arco-tokens.scss dist/ts/arco.tokens.js dist/json/arco.resolved.json; do
            if [[ ! -s "$f" ]]; then
              echo "ERROR: $f is missing or empty"
              exit 1
            fi
            echo "OK: $f ($(wc -c < $f) bytes)"
          done

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arco-tokens-dist
          path: dist/
          retention-days: 30

  # ── Job 3: Production Gate 2 — Code Gate ──────────────────────────────────
  gate-code:
    name: Gate 2 — No Hardcoded Values
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: arco-tokens-dist
          path: dist/

      - name: Run Code Gate
        run: node scripts/gates/gate-code.mjs

  # ── Job 4: Production Gate 3 — Delivery Gate ──────────────────────────────
  gate-delivery:
    name: Gate 3 — Delivery Manifest + Stories
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: arco-tokens-dist
          path: dist/

      - name: Run Delivery Gate
        run: node scripts/gates/gate-delivery.mjs

  # ── Job 5: Storybook Build (main branch only) ──────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: arco-tokens-dist
          path: dist/

      - name: Build Storybook
        run: npm run storybook:build

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-dist
          path: verification/storybook-dist/
          retention-days: 7
