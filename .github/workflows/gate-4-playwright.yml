name: Gate 4 — Playwright Component Tests

on:
  push:
    paths:
      - 'verification/storybook/**'
      - 'playwright/**'
      - 'source/component-contracts/**'
      - 'dist/**'
  pull_request:
    paths:
      - 'verification/storybook/**'
      - 'playwright/**'

jobs:
  playwright-tests:
    name: Playwright 3-Suite Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build token dist (required for token-contracts suite)
        run: npm run build

      - name: Suite 1 — Token Contracts (CSS var existence)
        run: npm run test:playwright:token-contracts
        env:
          CI: true

      - name: Suite 2 — Interaction Tests
        run: npm run test:playwright:interaction
        env:
          CI: true

      - name: Suite 3 — WCAG AA Accessibility Audit
        run: npm run test:playwright:a11y
        env:
          CI: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: reports/playwright/
          retention-days: 14

      - name: Upload Playwright trace on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ github.sha }}
          path: test-results/
          retention-days: 7
